<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintStax — Upload Photos</title>

  <!-- Roboto + Material Icons (from Google Fonts / MUI icon set) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
  <!--
    Auto-configure Firebase when deployed to Firebase Hosting.
    LOCAL DEV: If this 404s, uncomment the manual config block in app.js.
  -->
  <script src="/__/firebase/init.js"></script>
</head>
<body>
  <div id="root">

    <!-- ── Loading ──────────────────────────────────────────── -->
    <div id="view-loading" class="view center">
      <div class="md-progress-ring">
        <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke-width="4"/></svg>
      </div>
      <p class="text-secondary">Loading…</p>
    </div>

    <!-- ── Error ────────────────────────────────────────────── -->
    <div id="view-error" class="view center hidden">
      <div class="md-icon-circle error">
        <span class="material-symbols-rounded">error</span>
      </div>
      <h2 id="error-title">Session not found</h2>
      <p id="error-body" class="text-secondary"></p>
    </div>

    <!-- ── Upload form ──────────────────────────────────────── -->
    <div id="view-form" class="view hidden">

      <!-- App bar -->
      <div class="app-bar">
        <div class="app-bar-logo">P</div>
        <div>
          <span class="app-bar-title">PrintStax</span>
          <span class="app-bar-subtitle">Upload your photos for printing</span>
        </div>
      </div>

      <div class="content-wrap">

        <!-- Stepper -->
        <div class="stepper" id="stepper">
          <div class="step active" id="step-dot-1">
            <div class="step-circle">1</div>
            <span class="step-label">Your Info</span>
          </div>
          <div class="step-line"></div>
          <div class="step" id="step-dot-2">
            <div class="step-circle">2</div>
            <span class="step-label">Photos</span>
          </div>
        </div>

        <!-- ── Step 1: Info ─────────────────────────────────── -->
        <div id="step-info" class="card">
          <div class="field">
            <label class="field-label">
              <span class="material-symbols-rounded field-icon">person</span>
              Your name *
            </label>
            <input id="inp-name" type="text" placeholder="e.g. Sarah Johnson" autocomplete="name" class="md-input" />
          </div>

          <div class="field">
            <label class="field-label">
              <span class="material-symbols-rounded field-icon">calendar_today</span>
              Event / shoot date <span class="optional">(optional)</span>
            </label>
            <input id="inp-date" type="date" class="md-input" />
          </div>

          <button id="btn-next" class="md-btn md-btn-primary" style="margin-top:8px">
            Next
            <span class="material-symbols-rounded">arrow_forward</span>
          </button>
        </div>

        <!-- ── Step 2: Photos ───────────────────────────────── -->
        <div id="step-photos" class="hidden">

          <div id="drop-zone" class="drop-zone card">
            <input id="file-input" type="file" accept="image/*" multiple />
            <span class="material-symbols-rounded drop-icon">cloud_upload</span>
            <p class="drop-title">Tap to choose photos</p>
            <p class="text-secondary small">or drag &amp; drop — max 5 photos, 15 MB each</p>
          </div>

          <div id="preview-grid" class="preview-grid hidden"></div>

          <!-- Consent -->
          <div id="consent-wrap" class="consent-card hidden">
            <label class="checkbox-label">
              <input id="chk-consent" type="checkbox" class="md-checkbox" />
              <span>I consent to my photos being processed and printed for this event.</span>
            </label>
          </div>

          <div class="action-row">
            <button id="btn-back" class="md-btn md-btn-ghost">
              <span class="material-symbols-rounded">arrow_back</span>
              Back
            </button>
            <button id="btn-submit" class="md-btn md-btn-primary hidden" disabled>
              <span class="material-symbols-rounded">print</span>
              Submit Photos
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- ── Uploading ─────────────────────────────────────────── -->
    <div id="view-uploading" class="view center hidden">
      <div class="md-progress-ring">
        <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke-width="4"/></svg>
      </div>
      <p id="upload-status" class="upload-status-text">Uploading…</p>
      <div class="md-linear-progress">
        <div id="progress-bar" class="md-linear-progress-bar"></div>
      </div>
    </div>

    <!-- ── Success ───────────────────────────────────────────── -->
    <div id="view-success" class="view center hidden">
      <div class="md-icon-circle success">
        <span class="material-symbols-rounded">check_circle</span>
      </div>
      <h2>Photos submitted!</h2>
      <p class="text-secondary">The photographer will review and print your photos shortly.</p>
      <p id="success-count" class="text-tertiary small"></p>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
